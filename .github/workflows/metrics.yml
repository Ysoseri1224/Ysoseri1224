name: Metrics

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/metrics.svg
          committer_message: "chore: update metrics"
          base: ""
          repositories_forks: no
          config_timezone: Pacific/Auckland
          config_order: languages, stars, activity

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8

          plugin_stars: yes
          plugin_stars_limit: 4

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 30
          plugin_activity_visibility: public
          plugin_activity_filter: issue, pr, review, comment, release, ref/create, fork  # push events no longer carry commits in the GitHub API and crash the plugin
