name: Profile

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/profile.yml, scripts/**]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_USER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v5

      - run: python scripts/cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}

      # GITHUB_TOKEN is scoped to this repo, so only truly public activity is visible
      - run: python scripts/activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          git add assets README.md
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update profile cards and activity"
          git pull --rebase
          git push
